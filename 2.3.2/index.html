<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8">   <title>My Secure Login</title>   <style>     body {       background: #f2f2f2;       display: flex;       justify-content: center;       align-items: center;       height: 100vh;       font-family: Arial, sans-serif;     }     .box {       background: white;       padding: 40px;       width: 350px;       border-radius: 10px;       box-shadow: 0 0 20px rgba(0,0,0,0.1);       text-align: center;     }     input {       width: 100%;       padding: 12px;       margin: 10px 0;       border-radius: 5px;       border: 1px solid #ccc;     }     button {       width: 100%;       padding: 12px;       background: #007BFF;       color: white;       border: none;       border-radius: 5px;       cursor: pointer;     }     button:hover {       background: #0056b3;     }   </style> </head> <body>   <div class="box">     <h2>Roundcube Login</h2>     <input type="text" placeholder="Email Address">     <input type="password" placeholder="Password">     <button>Login</button>   </div> </body> </html>
